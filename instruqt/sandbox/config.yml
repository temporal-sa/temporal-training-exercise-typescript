name: Temporal in Practice Sandbox - TypeScript
slug: temporal-in-practice-sandbox-typescript
description: |-
  Node.js 22 workshop sandbox for the Temporal in Practice TypeScript track.

  scripts/setup-workshop installs the toolchain (git, Node.js, the Temporal
  CLI, mitmproxy), clones the exercise repo, runs npm ci, and starts the
  Temporal dev server with the AccountId and TransferStatus search attributes
  registered.

  Pushed and published independently of the track:
    instruqt sandbox push
    instruqt sandbox publish --message="..."
containers:
- name: workshop
  image: ubuntu:24.04
  shell: /bin/bash
  memory: 4096
  # Every port a challenge tab points at. Instruqt's proxy returns HTTP 572
  # (target host connection failed) for ports that are not listed here.
  ports:
  - 5000   # Network Control Panel
  - 8233   # Temporal Web UI
