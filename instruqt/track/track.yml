title: Temporal in Practice - TypeScript
teaser: Eight hands-on TypeScript exercises. Write the Workflows, Activities, Signals,
  Queries, tests and version patches yourself.
description: |-
  A hands-on Temporal workshop in TypeScript. Every challenge hands you a file
  full of TODOs and a Temporal dev server that is already running.

  Start with a Workflow that returns a greeting. Finish with a money
  transfer Workflow that takes a Signal for approval, answers Queries about
  its state, carries search attributes, parks on bad data until a human
  fixes it, and gets versioned with patched() without breaking the
  histories already recorded.

  The Solution tab has the finished code for every exercise. Use it when
  you get stuck, not before.
